version: "3.9"

services:
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    image: doc-ai-pipeline:latest
    container_name: doc-ai-pipeline
    ports:
      - "8000:8000"
    volumes:
      - pipeline_data:/app/data
    environment:
      - CASES_DB_PATH=/app/data/cases.db
      - CONFIDENCE_THRESHOLD=0.85
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  hitl:
    build:
      context: ..
      dockerfile: docker/Dockerfile.hitl
    image: doc-ai-hitl:latest
    container_name: doc-ai-hitl
    ports:
      - "8001:8001"
    volumes:
      - pipeline_data:/app/data        # Same named volume = shared cases.db
    environment:
      - CASES_DB_PATH=/app/data/cases.db
    depends_on:
      pipeline:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  pipeline_data:
    driver: local
