[project]
name = "doc-ai-pipeline"
version = "0.1.0"
description = "End-to-end document AI pipeline for handwritten form extraction with HITL feedback loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pillow>=10.3.0",
    "pyzbar>=0.1.9",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "python-barcode>=0.15.1",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.45.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "torch>=2.3.0",
    "qwen-vl-utils>=0.0.8",
]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
